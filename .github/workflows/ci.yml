name: Verificações

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificacoes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Análise e testes Dart
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter fontes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Preparar aplicação
        working-directory: app
        run: flutter pub get
      - name: Análise estática
        working-directory: app
        run: flutter analyze --no-pub
      - name: Preparar testes compartilhados
        working-directory: packages/validation
        run: flutter pub get
      - name: Testes compartilhados sem modelos
        working-directory: packages/validation
        run: flutter test --no-pub --reporter expanded
